# Round 5b (2026-10-10): round 5 rerun with an early-stopping warm-up (TRAINING_NOTES.md point 10).
# Identical to ml/kfold/r5_kfold_p840410_f0.yaml (point 9: partition seed 840410, test fold 0, validation
# fold 1) except run_name and warmup_epochs 25. Fixed before any round-5b run.
run_name: r5b_kfold_p840410_f0
train_datasets:
- DFK785
- DFK788
- DFK789
test_datasets:
- DFK785
- DFK788
- DFK789
augmentation:
  mirror: true
  time_invariance: true
  aug_factor: 0
  time_warp_sigma: 0.5
  noise_sigma: 0.5
  magnitude_jitter: 0.5
seed: 8404100
kfold:
  n_folds: 5
  fold: 0
  partition_seed: 840410
train_label_filter: paper_in
trace_assignment_runs:   # pinned to round 4's inputs: the folds depend on the exact pool
  DFK785: run_002
  DFK788: run_001
  DFK789: run_001
paper_in_runs:
  DFK785: run_001
  DFK788: run_001
  DFK789: run_002
model:
  name: orig_conv_gru
precision: fp32
optimization:
  batch_size: 64
  max_epochs: 500
  patience_limit: 10
  lr: 0.0004
  weight_decay: 0.0004
  label_smoothing: 0.001
  early_stopping:
    auc_min_delta: 0.005
    loss_mode: relative
    loss_tolerance: 1.1
    auc_tolerance: 0.003
    loss_min_delta: 0.005
    warmup_epochs: 25
mc_dropout:
  n_mc: 100
  trace_loss: 50.0
balance_val: true
