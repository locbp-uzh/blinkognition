# Dataset DFK785 (acquired 2026-09-28/29): single-label and mixed ATTO390 / ATTO520
# vesicle slides. See README.md in this folder and 20260926_readme.txt in the data.

# Raw data, read in place. Absolute path by design.
input_root: /Volumes/MediumBerth/Agent/20260928_DFK785

# Outputs, relative to the repo root (Results/ is gitignored).
output_root: Results/Revisions/DFK785

# Vesicle labels. home_channel: the dye's brightest channel among the unmixing
# channels; color: Okabe-Ito name for figures. Protein: HT7 in ATTO390, SNAP in ATTO520.
dyes:
  ATTO390:
    home_channel: "405"
    color: blue
    protein: HT7-HMSiR-HTL
  ATTO520:
    home_channel: "488"
    color: orange
    protein: SNAP-HMSiR-IA

# One entry per slide (numbering as in the data readme). dye: the label of every
# vesicle on a single-label slide, 'mix' for the mixed slides. One ND2 per channel and FOV,
# named <prefix>_<channel tag>[_NNNN].nd2; the unnumbered file is a FOV of its own.
slides:
  slide1:
    dye: ATTO520
    folder: SNAP520
    prefix: SNAP520
    sample: SNAP-HMSiR-IA in ATTO520 vesicles
    channels: ["405", "488", "640"]
  slide2:
    dye: ATTO390
    folder: HT390
    prefix: HT390
    sample: HT7-HMSiR-HTL in ATTO390 vesicles
    channels: ["405", "488", "640"]
  slide3:
    dye: mix
    folder: HT390_SNAP520
    prefix: HT390_SNAP520
    sample: mix 350 uL HT390 + 50 uL SNAP520, overnight, dried out overnight
    channels: ["405", "488", "515", "640"]
  slide4:
    dye: mix
    folder: HT390_SNAP520/new
    prefix: HT390_SNAP520
    sample: mix 350 uL HT390 + 50 uL SNAP520, next morning, dried out after about 25 FOVs
    channels: ["405", "488", "515", "640"]

# Channel files recorded within this many seconds of the previous one belong to the
# same FOV (a FOV takes about 6 s for its channels; FOVs are about 3.6 min apart).
fov_max_gap_s: 60

# Channel key -> file-name tag
channel_tags:
  "405": 405nm_TIRF2x_23pr_100ms_230x230
  "488": 488nm_TIRF2x_6pr_30ms_230x230
  "515": 515nm_TIRF2x_6pr_30ms_230x230
  "640": 640nm_TIRF2xLP_90pr_30ms_230x230

# Vesicle counting for the drying QC: the short movies (10 frames) are averaged and
# spots detected as in Revisions/Bleedthrough/segment.py. 640 (HMSiR, blinking) is
# not counted; only its acquisition time is read.
count_channels: ["405", "488", "515"]
background:
  median_size_px: 25
detection:
  psf_sigma_px: 1.6
  snr_threshold: 6.0
  min_separation_px: 3
  border_px: 10
  merge_radius_px: 2.5     # peaks of different channels this close are one vesicle (vesicles.py)

# Dried-out slides (move_dried.py): first FOV whose 405 + 488 count is below
# fraction x the median of the earlier FOVs, and every later FOV, go to bad_data/.
dried:
  fov_qc_run: run_002
  slides: [slide3, slide4]
  count_channels: ["405", "488"]
  fraction: 0.1
  min_before: 5

# ---------------------------------------------------------------------------
# Analysis (vesicles.py, unmix.py, occupancy.py). Decided 2026-10-02: labels by
# per-object unmixing with 405 + 488 (slides 1-2 have no 515; 515 is a check on
# the mixed slides); protein occupancy by the robust peak score of the 640 trace
# (A) with the GMM ON-frame count (B) as cross-check.

snapshot_channels: ["405", "488", "515"]     # 10-frame movies, averaged for photometry
detection_channels: ["405", "488", "515"]    # those present on a slide are used
camera:
  nonlinear_above_counts: 30000              # same iXon 888 as the revision test (any single frame)
photometry:
  aperture_radius_px: 3
  annulus_px: [5, 8]
  crowding_radius_px: 8                      # 1.04 um; crowded vesicles are left out of occupancy
blanks:
  n_per_fov: 150
  min_dist_px: 8
  seed: 42
n_jobs: 8

unmixing:
  vesicles_run: run_002
  channels: ["405", "488"]
  min_home_snr: 10                           # signature estimation, as in Revisions/Bleedthrough step 1
  exclude_crowded: true
  exclude_nonlinear: true
  presence_snr: 5.0                          # label present at >= this many home-channel noise SDs (open)

occupancy:
  unmixing_run: run_001
  crowding_radius_px: 5                      # vesicles with a neighbor closer than this are left out (0.65 um;
                                             # decided 2026-10-02, was 8 px = photometry.crowding_radius_px).
                                             # At 5 px <= 7 % of a neighbor's light reaches the 3 px aperture.
  aperture_radius_px: 3
  annulus_px: [5, 8]
  registration:
    fovs_per_slide: 6                        # FOVs used to measure the 640 vs vesicle offset
    min_score: 20                            # clearly positive traces used for the offset
    on_sigma: 5.0                            # frames above this many MADs count as ON for the centroid
    window_half_px: 3
    apply_above_px: 0.3                      # apply the offset only if larger than this
  blank_pass_fraction: 0.01                  # thresholds A and B let at most this fraction of blanks pass
  gmm_proba_threshold: 0.9                   # Extraction/config.yaml
  gmm_min_separation: 3.0                    # Extraction/filter.py default; without it GMM splits pure noise
  b_prescreen_score: 7.0                     # B runs where A >= this (pure noise scores ~5.8 over 6000 frames), plus an audit sample
  b_audit_fraction: 0.05
  seed: 42
  sensitivity_scores: [8, 10, 15, 20, 30]

# Assignment of the paper pipeline's protein traces to labeled vesicles (assign_traces.py).
trace_assignment:
  extraction_run: Results/Revisions/DFK785/Extraction/Slide1SNAP_Slide2HT_Slide3Mix_Slide4Mix_optparam_001   # single-channel run of extraction/config_640only.yaml
  extraction_keys: [Slide1SNAP, Slide2HT, Slide3Mix, Slide4Mix]
  link_map: Inputs/DFK785_640only/link_map.tsv
  unmixing_run: run_001
  registration_from_occupancy_run: run_004 # per-detection-channel 640 offsets
  boxsize: 5                               # Extraction ROI box; center = top-left + boxsize / 2
  match_radius_px: 2.0                     # user decision 2026-10-02: in the mixture a protein must not be
                                           # assigned to the wrong vesicle (4 px: 30-53 % chance hits on slides
                                           # 3-4; real pairs lie within 2.5 px). The paper's training data keep
                                           # Extraction's 4 px (max_dist_closest_ground_truth), unchanged.
  null_radii_px: [1.5, 2.0, 2.5, 3.0, 4.0]  # chance coincidences vs neighbor-FOV vesicles at these radii

# brightness.py: HMSiR photons per localization, paper acquisitions vs DFK785, with
# the paper's localization settings (Extraction/config.yaml camera block) and one
# fixed gradient (the value optimized for both DFK785 protein channels).
brightness:
  paper_root: /Volumes/MediumBerth/AllMovies
  paper_movies:                            # three 640 movies per protein and experiment (SP_Exp1-4)
    HaloD106:                              # AllMovies folder HTHTL
      - 20231130_SP_Exp1/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20231130_SP_Exp1/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20231130_SP_Exp1/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
      - 20231201_SP_Exp2/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20231201_SP_Exp2/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20231201_SP_Exp2/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
      - 20240108_SP_Exp3/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20240108_SP_Exp3/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20240108_SP_Exp3/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
      - 20240109_SP_Exp4/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20240109_SP_Exp4/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20240109_SP_Exp4/HTHTL/HTHTL_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
    SNAPC148:                              # AllMovies folder snap
      - 20231130_SP_Exp1/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20231130_SP_Exp1/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20231130_SP_Exp1/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
      - 20231201_SP_Exp2/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20231201_SP_Exp2/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20231201_SP_Exp2/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
      - 20240108_SP_Exp3/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20240108_SP_Exp3/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20240108_SP_Exp3/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
      - 20240109_SP_Exp4/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0005.nd2
      - 20240109_SP_Exp4/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0010.nd2
      - 20240109_SP_Exp4/snap/snap_640nm_TIRF2xLP_90pr_30ms_230x230_0020.nd2
  dfk785_sets:
    DFK785 slide2 HT:
      protein: HaloD106
      run: Results/Revisions/DFK785/Extraction/HT390_optparam_001
    DFK785 slide1 SNAP:
      protein: SNAPC148
      run: Results/Revisions/DFK785/Extraction/SNAP520_optparam_001
  gradient: 20000
  camera: {boxsize: 5, baseline: 79, sensitivity: 16.0, gain: 300, quantum_efficiency: 0.93, method: mle}
  frame_windows: [[0, 6000], [0, 1000], [3000, 6000]]   # [start, end); DFK785 movies and traces are 6000 frames
