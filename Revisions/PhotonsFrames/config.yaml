# Revisions/PhotonsFrames: photons per ON event and frame-time effects (R3.3). Settings of this topic only;
# the published Extraction/ and Features/ defaults are not changed. Data access via ../PaperData/config.yaml.

# ON events exactly as for Figs. 5D and 6C (Features/config.yaml): the paper's frame classifier
# (Extraction/utils.py gmm_classify_frames) on the per-trace min-max trace, posterior >= 0.9, runs of
# >= 1 frame. Here on the full 6000-frame traces (Figs. 5D, 6C used the first 4000, the final models'
# input).
gmm_proba: 0.9
min_peak_width: 1

# Robustness: photons summed over each event plus this many frames on each side (clipped at the trace
# ends; a single OFF frame between two events is counted in both padded sums).
pad_frames: 1

# Full-frame emission: inner frames (first and last excluded) of events of at least this many frames.
interior_min_frames: 3

# The paper's quality filter as run for the published extraction (Extraction/config.yaml and the
# defaults of Extraction/filter.py), replayed by filter_audit.py. gmm_min_separation is not in
# config.yaml; filter.py defaults it to 3.0: traces with GMM separation below 3 get no ON frames.
filter:
  gmm_proba_threshold: 0.9
  gmm_min_separation: 3.0
  snr_min_separation: 2.0
  max_duty_cycle: 0.3
  min_peak_number: 3
  min_peak_width: 1
  first_peak_time: 1000
  last_peak_time: 100
  delta_first_second: 1000

# Molecule-like traces among those the SNR gates reject (R3.3b; user confirmed 2026-11-20).
# Bright frames: frames above the trace's median + k x sigma, sigma = 1.4826 x MAD of the trace.
# Threshold: per session, the reference_quantile of the bright-frame counts of that session's
# unfiltered background traces; a trace rejected at separation < separation_cut is molecule-like if
# its count exceeds it. k_main is the reported rule; the other k values are the sensitivity check.
bright_frames:
  k_values: [4, 5, 6]
  k_main: 5
  mad_to_sigma: 1.4826
  reference_quantile: 0.99
  separation_cut: 3.0

constructs: [HaloD106, SNAPC148, HaloK117, scGrx1, scGrx1AcK20]
n_jobs: 16
output_root: Results/Revisions/PhotonsFrames
