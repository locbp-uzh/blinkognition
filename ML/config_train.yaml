io:
  output_root: "../Results/Train"
  run_name: "smoketest"


data:
  traces_path: "../Inputs/FinalTraces/ProteinTracesIN/Filtered"
  dataset:
    HaloD106:
      channels: ["minmax", "zscored"]
    SNAPC148:
      channels: ["minmax", "zscored"]


  trim_end: 2000
  max_traces_per_class: 2000
  balance_train: true
  balance_val: true   # Balance val set by subsampling majority classes (prevents biased early stopping)
  balance_test: true  # Balance test set by subsampling majority classes

  # Data augmentation (applied ONLY to training set to prevent data leakage)
  # Helps improve model generalization and performance, especially with limited data
  augmentation:
    enabled: false
    aug_factor: 0
    include_mirror: false

model:
  name: "resnet1d"     # one of: orig_conv_gru, resnet1d, tcn
  # Default parameters are hardcoded in the model zoo (models.py)
  # Override specific parameters here if needed

optimization:
  batch_size: 64
  max_epochs: 500
  patience_limit: 15
  lr: 0.0004
  weight_decay: 0.0004
  label_smoothing: 0.001

  # Early stopping configuration
  # Primary condition: Checkpoint when BOTH are met:
  # 1. AUC improves by at least auc_min_delta
  # 2. Loss is within loss_tolerance of the best loss seen
  # Alternative condition (optional): Checkpoint when BOTH are met:
  # 1. AUC is within auc_tolerance of best (even if not improving)
  # 2. Loss improves by at least loss_min_delta
  # This allows saving checkpoints with slightly lower AUC but better loss (often better accuracy)
  early_stopping:
    auc_min_delta: 0.005    # Minimum AUC improvement required (0.5%)
    loss_mode: "relative"   # "relative", "absolute", or "none"
    loss_tolerance: 1.10    # For relative: loss <= best_loss * 1.10 (max 10% higher)
                            # For absolute: loss <= best_loss + tolerance
    # Alternative checkpoint (uncomment to enable):
    auc_tolerance: 0.003  # Max AUC drop from best to allow alternative checkpoint
    loss_min_delta: 0.005  # Min loss improvement required for alternative checkpoint

  # Threshold selection method for binary classification
  # - "argmax": Use standard argmax (no threshold optimization) - RECOMMENDED for balanced datasets
  # - "mcc": Optimize Matthews Correlation Coefficient
  # - "balanced_accuracy": Optimize balanced accuracy across classes
  # - "f1": Optimize F1 score
  # - "youden": Optimize Youden's J statistic (sensitivity + specificity - 1)
  # - "min_recall": Maximize minimum recall across both classes
  threshold_metric: "argmax"


uncertainty:
  mc_dropout:
    enabled: true
    n_mc: 100
    trace_loss: 50.0              # Maximum trace loss % for auto threshold selection
    # wasserstein_threshold: 0.1  # Optional: fixed Wasserstein threshold (overrides trace_loss)

system:
  compile: false
  num_workers: 4
  seed: 840410
  verbose: false    # set true to show sanity checks (confusion matrices, detailed metrics) during training
