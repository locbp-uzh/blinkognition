io:
  output_root: "../Results/CrossVal"
  run_name: "notmirrored_grx1_k20ac_minmax"

data:
  traces_path: "/shares/locbp.chem.uzh/pabriv/SalomeData/March25_proteintraces"
  dataset:
    Grx1:
      channels: ["minmax"]
    K20Ac:
      channels: ["minmax"]


trim_end: 2000
max_traces_per_class: 10000
balance_train: true
balance_val: true
balance_test: true


compare:
  models: ["orig_conv_gru", "resnet1d", "tcn"]


cv:
  n_splits: 4
  shuffle: true
  seed: 840410


optimization:
  batch_size: 64
  lr: 0.0004
  weight_decay: 0.0004
  max_epochs: 500
  patience_limit: 10
  label_smoothing: 0.001

  early_stopping:
    auc_min_delta: 0.005
    loss_mode: "relative"
    loss_tolerance: 1.10
    auc_tolerance: 0.003
    loss_min_delta: 0.005

  threshold_metric: "argmax"

  use_focal_loss: false
  focal_gamma: 2.0


hpo:
  enabled: false
  storage_root: "../Optuna_Databases"
  user: "auto"
  dataset_scope: "auto"
  fallback_to_other_users: true
  fallback_to_shared: true
  fallback_to_other_datasets: true


uncertainty:
  mc_dropout:
    enabled: true
    n_mc: 100
    wasserstein_threshold: 0.7


system:
  compile: false
  num_workers: 4
  seed: 840410
  n_gpus: 3


augmentation_sweep:
  enabled: true
  factors: [0, 3, 5]
  augmentation_params:
    time_warp_sigma: 0.05
    noise_sigma: 0.05
    magnitude_jitter: 0.05
    include_mirror: false
