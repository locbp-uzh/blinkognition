# blink_features_config.yaml
# Configuration for assets/blink_features.py

# Path to the Filtered/ subfolder (ProteinTracesIN/Filtered, ProteinTracesOUT/Filtered,
# or ProteinTraces/Filtered for no-ground-truth runs)
traces_folder: /Volumes/MediumBerth/March27_NewRepo/Grx1_HTHTL_HTIA_K20Ac_snap_optparam_002/ProteinTracesIN/Filtered

# Number of traces to sample per protein (uses all available if fewer than N)
n_traces: 500

# Output directory — will be created if it does not exist
output_path: /Users/privera/Desktop/repos/Hub/blinkognition/Results/Features

# Frame interval in milliseconds — used to convert peak duration from frames to ms
frame_interval_ms: 30.0

# Random seed for reproducible trace sampling
seed: 42

# ── Outlier filtering ─────────────────────────────────────────────────────────
# Entire traces are removed (not just individual peaks) if any peak exceeds
# either threshold. Thresholds are applied before plotting.
max_peak_duration_s: 1          # Remove traces with any peak longer than this (seconds)
intensity_clip_percentile: 99    # Remove traces with any peak above this percentile
                                 # of all peak intensities across all proteins

# ── GMM parameters ────────────────────────────────────────────────────────────
# Keep these consistent with the values used in your extraction config.yaml
gmm_proba_threshold: 0.6    # Posterior probability threshold for signal classification
snr_min_separation: 2.0     # Min (signal_mean - noise_mean) / noise_std to accept a trace
min_peak_width: 1           # Min consecutive "on" frames to count as a peak

# ── MCD certainty filter (optional) ───────────────────────────────────────────
# When enabled, only traces present in the MCD NPZ AND with WD >= wasserstein_min
# are used for proteins whose names match the NPZ class_names.  Other proteins
# (e.g. Grx1, HTIA, K20Ac when the model was trained on HTHTL vs snap) are
# sampled randomly as usual.
# Recommended threshold: 0.7 (keeps ~64% of test traces, accuracy 93.5%)
#                        0.9 (keeps ~41% of test traces, accuracy 96.8%)
#
mcd_filter:
  npz_path: /Users/privera/Desktop/repos/Hub/blinkognition/Results/Train/2026-03-27_14-01-25_resnet_train_both_noaug_mirrored_training_HTHTL_HTIA/MCD_results/traces_with_wasserstein.npz
  wasserstein_min: 0.7  # keep traces with WD >= this value (range ~0–1)
