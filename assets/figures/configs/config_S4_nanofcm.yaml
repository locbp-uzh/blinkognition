# Figure S4 — NanoFCM Vesicle Membrane Mixing
# Samples: SP522, SP523, SP528
# Run with: python figure_S4_nanofcm.py

output_dir: /Volumes/MediumBerth/SalomePaperData/Figure_S4/Results

log_level: INFO

# NanoFCM channel names
fitc_channel: FITC-H    # Atto520 (ex 488 nm)
pc5_channel:  PC5-H     # Atto647N (ex 638 nm)
ss_channel:   SS-H      # Side scatter (size gate)

# Scatter gate: keep events between these percentiles on SS-H
ss_gate_min_percentile: 5.0
ss_gate_max_percentile: 99.5

# Fluorescence threshold: Nth percentile of the negative-for-that-dye control
control_percentile: 99.0

# Each sample may span multiple acquisition-day directories
# SP522: two days; SP523: two days + re-measurement; SP528: two days
samples:
  SP522:
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP522/20240923_SP522/20240923
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP522/20240924_SP522

  SP523:
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP523/20240925
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP523/20240926
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP523/Remeasured_2509

  SP528:
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP528/20241016
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP528/20241017
    - /Volumes/MediumBerth/SalomePaperData/Figure_S4/Vesicle_mixing_NanoFCM/SP528/20241017/Remeasured/20241017
