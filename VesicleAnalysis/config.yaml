# Vesicle Analysis Configuration
# Minimal configuration for gradient sweep and protein-GT correlation analyses

# =============================================================================
# I/O Configuration
# =============================================================================
input_folder: /path/to/vesicle/data       # root folder containing per-experiment ND2 files
output_folder_base: /path/to/vesicle/data/Results

# =============================================================================
# Protein Selection
# =============================================================================
proteins:
  - HaloD106
  - scGrx1AcK20

# =============================================================================
# Channel Configuration
# =============================================================================
protein_channel: "640"       # Protein signal channel
ground_truth_channel: "488"  # Ground truth channel (set to null for single-channel)

# =============================================================================
# Localization Parameters
# =============================================================================
boxsize: 9                   # ROI box size (pixels)
baseline: 79                 # Camera baseline (counts)
sensitivity: 16.0            # EM gain sensitivity
gain: 300                    # EM gain
quantum_efficiency: 0.93     # QE of camera

# Default gradients (can be overridden via CLI)
gradient_protein: 60000      # Gradient for protein channel
gradient_ground_truth: 5000  # Gradient for ground truth channel

# =============================================================================
# Analysis Parameters
# =============================================================================
# For GT-protein correlation
max_distance_ground_truth: 2.5  # Max distance for clustering GT localizations (pixels)
min_on_ground_truth: 3          # Min localizations to call a GT cluster
n_frames_integrate: 10          # Number of frames to integrate for intensity

# For gradient sweep - specify gradients explicitly
gradient_list: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]

# Alternative: use gradient_sweep for automatic range generation
# gradient_sweep:
#   min: 1000
#   max: 10000
#   step: 1000

# =============================================================================
# Parallel Processing
# =============================================================================
# Number of parallel workers (CPUs)
# Options:
#   -1 or null: Use all available CPUs
#   1: Sequential processing
#   N > 1: Use N worker processes
n_workers: -1
