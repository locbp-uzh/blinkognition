# Path is relative to Controls/random_forest/ where rf_pipeline.py is run.
traces_path: "../../Inputs/FinalTraces/ProteinTracesIN/Filtered"

# Available proteins: HaloD106, HaloK117, SNAPC148, scGrx1, scGrx1AcK20
proteins: ["HaloD106", "SNAPC148"]
channel: "minmax"   # "minmax" or "zscored"

output_root: "../../Results/Controls/RandomForest"

gmm:
  proba: 0.9
  min_peak_width: 1
  frame_interval_ms: 30.0

random_forest:
  n_estimators: 500
  test_size: 0.20
  seed: 840410
  trace_loss: 50.0
