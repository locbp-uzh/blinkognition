# Path to a completed training run (Results/Train/<run_name>/).
# The directory must contain best_model.pt and config_full.json.
pretrained_model_dir: "/path/to/Results/Train/<run_name>"

# Path is relative to Controls/noise_classification/ where classify_noise.py is run.
background_traces_path: "../../../Inputs/FinalTraces/BackgroundTraces/Filtered"

# Proteins whose background traces to classify.
# Available: HaloD106, HaloK117, SNAPC148, scGrx1, scGrx1AcK20
proteins: ["HaloD106", "SNAPC148"]
channels: ["minmax", "zscored"]

output_root: "../../Results/Controls/NoiseClassification"

mc_dropout:
  n_mc: 100
  trace_loss: 50.0
  # wasserstein_threshold: 0.61  # optional: fix WD threshold instead of auto-selecting

system:
  seed: 840410
  num_workers: 4
