io:
  output_root: "../../Results/Controls/LabelScrambling"
  run_name: "label_scrambled"

data:
  # Path is relative to Controls/label_scrambling/ where scramble_train.py is run.
  traces_path: "../../../Inputs/FinalTraces/ProteinTracesIN/Filtered"

  dataset:
    # Available proteins: HaloD106, HaloK117, SNAPC148, scGrx1, scGrx1AcK20
    HaloD106:
      channels: ["minmax", "zscored"]
    SNAPC148:
      channels: ["minmax", "zscored"]
  trim_end: 2000
  max_traces_per_class: 10000  # Cap per protein (paper: 10000; set lower for quick tests)
  balance_train: true
  balance_val: true
  balance_test: true
  augmentation:
    enabled: false   # Augmentation is intentionally off for this control
    aug_factor: 0
    include_mirror: false

model:
  name: "resnet1d"   # one of: orig_conv_gru, resnet1d, tcn

optimization:
  batch_size: 64
  max_epochs: 500
  patience_limit: 10
  lr: 0.0004
  weight_decay: 0.0004
  label_smoothing: 0.001
  early_stopping:
    auc_min_delta: 0.005
    loss_mode: "relative"
    loss_tolerance: 1.10
    auc_tolerance: 0.003
    loss_min_delta: 0.005
  threshold_metric: "argmax"

uncertainty:
  mc_dropout:
    enabled: true
    n_mc: 100
    trace_loss: 50.0

system:
  compile: false
  num_workers: 4
  seed: 840410
  verbose: false
