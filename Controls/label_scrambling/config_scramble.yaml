io:
  output_root: "../../Results/Controls/LabelScrambling"
  run_name: "label_scrambled"

data:
  traces_path: "/Volumes/MediumBerth/March27_NewRepo/Grx1_HTHTL_HTIA_K20Ac_snap_optparam_002/ProteinTracesIN/Filtered"
  dataset:
    Grx1:
      channels: ["minmax", "zscored"]
    K20Ac:
      channels: ["minmax", "zscored"]
  trim_end: 0
  max_traces_per_class: 0
  balance_train: true
  balance_val: true
  balance_test: true
  augmentation:
    enabled: true
    aug_factor: 1
    time_warp_sigma: 0.0
    noise_sigma: 0.0
    magnitude_jitter: 0.0
    include_mirror: true

model:
  name: "tcn"

optimization:
  batch_size: 64
  max_epochs: 500
  patience_limit: 10
  lr: 0.0004
  weight_decay: 0.0004
  label_smoothing: 0.001
  early_stopping:
    auc_min_delta: 0.005
    loss_mode: "relative"
    loss_tolerance: 1.10
    auc_tolerance: 0.003
    loss_min_delta: 0.005
  threshold_metric: "argmax"

uncertainty:
  mc_dropout:
    enabled: true
    n_mc: 100
    trace_loss: 50.0

system:
  compile: false
  num_workers: 4
  seed: 840410
  verbose: false
