io:
  output_root: "../../Results/Controls/LabelScrambling"
  run_name: "label_scrambled"

data:
  traces_path: "/Volumes/MediumBerth/SalomePaperData/FinalDataset/FinalTraces/Grx1_HTHTL_HTIA_K20Ac_snap_optparam_001/ProteinTracesIN/Filtered"
  dataset:
    HTHTL:
      channels: ["minmax", "zscored"]
    snap:
      channels: ["minmax", "zscored"]
  trim_end: 2000
  max_traces_per_class: 2000
  balance_train: true
  balance_val: true
  balance_test: true
  augmentation:
    enabled: false
    aug_factor: 0
    include_mirror: false

model:
  name: "resnet1d"

optimization:
  batch_size: 64
  max_epochs: 500
  patience_limit: 10
  lr: 0.0004
  weight_decay: 0.0004
  label_smoothing: 0.001
  early_stopping:
    auc_min_delta: 0.005
    loss_mode: "relative"
    loss_tolerance: 1.10
    auc_tolerance: 0.003
    loss_min_delta: 0.005
  threshold_metric: "argmax"

uncertainty:
  mc_dropout:
    enabled: true
    n_mc: 100
    trace_loss: 50.0

system:
  compile: false
  num_workers: 4
  seed: 840410
  verbose: false
