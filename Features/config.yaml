# Configuration for Features/features.py
# Results are saved to Results/Features/{proteins}_mcd_{timestamp}/

# =============================================================================
# MCD certainty filter
# =============================================================================
# Path to the traces_with_wasserstein.npz file produced by a training run.
# Found at: Results/Train/<run_name>/MCD_results/traces_with_wasserstein.npz
mcd_filter:
  npz_path: "/path/to/Results/Train/<run_name>/MCD_results/traces_with_wasserstein.npz"
  wasserstein_min: 0.7    # keep traces with WD >= this value; range ~0–1
                          # 0.7 → ~54% of traces, balanced certainty
                          # 0.9 → ~40% of traces, highest certainty


# =============================================================================
# GMM peak detection
# =============================================================================
gmm_proba_threshold: 0.9    # posterior probability threshold for "on" frame classification
                             # keep consistent with Extraction/config.yaml
min_peak_width: 1            # minimum consecutive "on" frames to count as a peak


# =============================================================================
# Acquisition settings
# =============================================================================
frame_interval_ms: 30.0      # camera frame interval in milliseconds


# =============================================================================
# Reproducibility
# =============================================================================
seed: 840410
